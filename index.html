<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIMM questionnaire 2026 - explorer</title>
<style>
  :root { --ink:#1d1d1f; --ink2:#5b5b60; --muted:#8a8a8f; --hair:#e3e3e0; --bg:#fff;
          --l1:#B3402F; --l2:#EE9F8C; --l3:#E2E1DD; --l4:#86AED8; --l5:#245A93; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--ink); background: var(--bg); font-size: 14px; }
  header { padding: 28px 40px 8px; }
  .kicker { font-size: 11px; letter-spacing: .12em; font-weight: bold; color: var(--ink2); text-transform: uppercase; }
  h1 { font-size: 26px; margin: 6px 0 4px; }
  .sub { color: var(--ink2); margin: 0 0 12px; }
  nav { padding: 0 40px; border-bottom: 1px solid var(--hair); display: flex; gap: 24px; }
  nav button { background: none; border: none; padding: 10px 0; font: inherit; color: var(--ink2); cursor: pointer; border-bottom: 2px solid transparent; }
  nav button.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: bold; }
  main { padding: 20px 40px 60px; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; margin-bottom: 18px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink2); }
  select, input[type=search] { font: inherit; padding: 6px 8px; border: 1px solid #cfcfcb; border-radius: 4px; background: #fff; color: var(--ink); min-width: 180px; }
  .legend { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink2); margin-bottom: 10px; }
  .sw { width: 22px; height: 14px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; border-radius: 2px; }
  table.lk { border-collapse: collapse; width: 100%; max-width: 1150px; }
  table.lk td { padding: 4px 6px; vertical-align: middle; }
  table.lk tr.first td { border-top: 1px solid var(--hair); }
  .itemlab { width: 330px; font-size: 13px; }
  .grp { width: 190px; font-size: 12px; }
  .grp .n { color: var(--muted); }
  .bar { display: flex; height: 22px; width: 100%; min-width: 300px; }
  .dbar { position: relative; height: 22px; width: 100%; min-width: 300px; }
  .dbar .seg { position: absolute; top: 0; }
  .dbar .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; border-left: 1px solid #9a9a96; }
  .nbar { position: relative; height: 22px; width: 80px; background: #fff; border: 1px solid #e4e2dd; flex: none; }
  .nbar .seg { position: absolute; left: 0; top: 0; }
  .seg { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 10px; border-right: 1px solid #fff; overflow: hidden; cursor: default; }
  .num { width: 60px; text-align: right; font-size: 12px; }
  .num.u { font-weight: bold; }
  .hidden { color: var(--muted); font-size: 12px; font-style: italic; }
  .note { color: var(--ink2); font-size: 12px; max-width: 1150px; margin-top: 12px; }
  #tip { position: fixed; pointer-events: none; background: #1d1d1f; color: #fff; font-size: 12px; padding: 6px 8px; border-radius: 4px; display: none; z-index: 9; }
  table.hm { border-collapse: collapse; font-size: 12px; }
  table.hm th { font-weight: bold; padding: 6px 8px; text-align: center; vertical-align: bottom; }
  table.hm th .n { display: block; font-weight: normal; color: var(--muted); }
  table.hm td { padding: 3px 8px; text-align: center; }
  table.hm td.lab { text-align: left; white-space: nowrap; }
  table.hm td.area { text-align: left; font-weight: bold; color: var(--ink2); white-space: nowrap; }
  table.hm tr.sep td { border-top: 1px solid var(--hair); }
  .cmt { border-top: 1px solid var(--hair); padding: 10px 0; max-width: 900px; }
  .cmt .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .tag { display: inline-block; font-size: 11px; color: var(--ink2); background: #f2f2f0; border-radius: 3px; padding: 1px 6px; margin-right: 4px; }
  .count { color: var(--ink2); font-size: 12px; margin-bottom: 6px; }
  .themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 4px 24px; max-width: 1150px; margin-bottom: 16px; }
  .th { display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; }
  .th .tb { height: 10px; background: #DCC39B; }
  .th.on { font-weight: bold; }
</style>
</head>
<body>
<header>
  <div class="kicker">FIMM PhD and Postdoc Questionnaire 2026 &middot; private explorer</div>
  <h1>Explore the answers</h1>
  <p class="sub">Pick a question and a split. Groups with fewer than 3 people are hidden. Unfav. = share answering 1-2 (funding worry: 4-5), Fav. = 4-5.</p>
</header>
<nav>
  <button data-tab="items" class="on">Questions by group</button>
  <button data-tab="heat">All questions at once</button>
  <button data-tab="cmts">Comments</button>
</nav>
<main>
  <section id="items">
    <div class="controls">
      <label>Area <select id="area"></select></label>
      <label>Split by <select id="split"></select></label>
      <label>Respondents <select id="role"><option value="">PhD and postdoc</option><option>PhD</option><option>Postdoc</option></select></label>
      <label>Display <select id="mode"><option value="stack">Stacked bar (100%)</option><option value="div">Diverging, neutral in the middle</option><option value="divn">Diverging, neutral shown apart</option></select></label>
    </div>
    <div class="legend">Answer scale &nbsp;negative
      <span class="sw" style="background:var(--l1);color:#fff">1</span><span class="sw" style="background:var(--l2)">2</span><span class="sw" style="background:var(--l3)">3</span><span class="sw" style="background:var(--l4)">4</span><span class="sw" style="background:var(--l5);color:#fff">5</span> positive
    </div>
    <table class="lk" id="lk"></table>
    <p class="note" id="lknote"></p>
  </section>
  <section id="heat" style="display:none">
    <div class="controls">
      <label>Split by <select id="hsplit"></select></label>
      <label>Respondents <select id="hrole"><option value="">PhD and postdoc</option><option>PhD</option><option>Postdoc</option></select></label>
      <label>Show <select id="hmetric"><option value="u">% unfavourable</option><option value="f">% favourable</option><option value="m">mean (1-5)</option></select></label>
    </div>
    <div id="hm"></div>
  </section>
  <section id="cmts" style="display:none">
    <div class="controls">
      <label>Question <select id="cq"></select></label>
      <label>Respondents <select id="crole"><option value="">PhD and postdoc</option><option>PhD</option><option>Postdoc</option></select></label>
      <label>Search <input type="search" id="cs" placeholder="word in comment"></label>
    </div>
    <div class="themes" id="ct"></div>
    <div class="count" id="cc"></div>
    <div id="cl"></div>
  </section>
</main>
<div id="tip"></div>

media to ask them.", "themes": ["Unclear on tax, healthcare, housing"], "areas": ["International and language"]}, {"role": "Postdoc", "q": "What info was missing / helpful (intl)", "text": "Most of the information I received about moving to Finland came from colleagues within the group I moved to.", "themes": ["Helped: HR call, documents, colleagues"], "areas": ["International and language"]}, {"role": "PhD", "q": "What info was missing / helpful (intl)", "text": "I was very overwhelmed with the tax system and still haven't fully understood the health care properly when to contact Mehil\u00e4inen and Kela, etc", "themes": ["Unclear on tax, healthcare, housing"], "areas": ["International and language"]}, {"role": "PhD", "q": "What info was missing / helpful (intl)", "text": "there was no help or guidance except information on the webpages", "themes": ["Unclear on tax, healthcare, housing"], "areas": ["International and language"]}, {"role": "Postdoc", "q": "What info was missing / helpful (intl)", "text": "Pre arrival and post arrival document shared by HR", "themes": ["Helped: HR call, documents, colleagues"], "areas": ["International and language"]}, {"role": "PhD", "q": "What info was missing / helpful (intl)", "text": "Housing, health care and taxation could have been described better before hand.", "themes": ["Unclear on tax, healthcare, housing"], "areas": ["International and language"]}, {"role": "Postdoc", "q": "What info was missing / helpful (intl)", "text": "It was helpful to have a call with an HR before arriving in Finland", "themes": ["Helped: HR call, documents, colleagues"], "areas": ["International and language"]}, {"role": "PhD", "q": "What info was missing / helpful (intl)", "text": "I still haven't udnerstood the Finnish healthcare or tax system", "themes": ["Unclear on tax, healthcare, housing"], "areas": ["International and language"]}, {"role": "PhD", "q": "What info was missing / helpful (intl)", "text": "I didn't recieve any information but I was already working in BM1 so I luckily knew Finland by that point. However, it would have been nice to have an introduction booklet to FIMM itself as it took me a while to understand who everyone is and how things are organised (not sure if this happens now).", "themes": ["Wants one guide or info package"], "areas": ["International and language"]}, {"role": "Postdoc", "q": "What info was missing / helpful (intl)", "text": "I received some general information when I started, but much of what I needed I had to find out on my own. But at this moment, I cannot really say what was exactly missing.", "themes": ["Unclear on tax, healthcare, housing"], "areas": ["International and language"]}, {"role": "PhD", "q": "One thing to make life easier for intl researchers", "text": "Provide more meaningful career opportunities outside of academia.", "themes": ["Careers outside academia"], "areas": ["Progress and career"]}, {"role": "PhD", "q": "One thing to make life easier for intl researchers", "text": "More events for international students", "themes": ["Events, language, culture"], "areas": ["International and language"]}, {"role": "Postdoc", "q": "One thing to make life easier for intl researchers", "text": "Provide a point of contact with a local for someone who can help introduce you to life in Finland.", "themes": ["Wants a contact person or set onboarding"], "areas": ["International and language"]}, {"role": "PhD", "q": "One thing to make life easier for intl researchers", "text": "Don't provide all information about the tax, health and housing rules in the first few days while people struggle to find the bathroom. Prioritize the information and give it in more details when needed.", "themes": ["Info comes too early, all at once"], "areas": ["International and language"]}, {"role": "PhD", "q": "One thing to make life easier for intl researchers", "text": "encouraging groups to have some onboarding process for international students and having a contact person for support", "themes": ["Wants a contact person or set onboarding"], "areas": ["International and language"]}, {"role": "Postdoc", "q": "One thing to make life easier for intl researchers", "text": "Dear Unihome, please add electricity contract on the lease, please", "themes": ["Unclear on tax, healthcare, housing"], "areas": ["International and language"]}, {"role": "PhD", "q": "One thing to make life easier for intl researchers", "text": "Create an info package", "themes": ["Wants one guide or info package"], "areas": ["International and language"]}, {"role": "PhD", "q": "One thing to make life easier for intl researchers", "text": "Maybe have an international researchers association?", "themes": ["Events, language, culture"], "areas": ["International and language"]}, {"role": "PhD", "q": "One thing to make life easier for intl researchers", "text": "have a standardized onboarding procedure which includes more information about housing", "themes": ["Wants a contact person or set onboarding", "Unclear on tax, healthcare, housing"], "areas": ["International and language"]}, {"role": "PhD", "q": "One thing to make life easier for intl researchers", "text": "Be more open about salary and have more regular info sessions about healthcare and taxes, not just in the beginning where everyone is overwhelmed anyway", "themes": ["Info comes too early, all at once", "Unclear on tax, healthcare, housing"], "areas": ["International and language"]}, {"role": "PhD", "q": "One thing to make life easier for intl researchers", "text": "Something of a Finnish language bootcamp before moving would be nice. \n\nBefore moving, I was told that the University of Helsinki offered Finnish language courses - which they do! However, the deadline for enrollment was the same day as my first day of employment and before I got Flamma sorted out. The university does offer a WordDive membership, which has helped, but the delay for classes is a minor annoyance.", "themes": ["Events, language, culture"], "areas": ["International and language"]}, {"role": "PhD", "q": "One thing to make life easier for intl researchers", "text": "Teach parts of cultures that are not taught generally to people outside EU, especially what trash to put in what kind of bin", "themes": ["Events, language, culture"], "areas": ["International and language"]}, {"role": "Postdoc", "q": "One thing to make life easier for intl researchers", "text": "Handbook with guidelines for burocratical staff, intra and extra FIMM.", "themes": ["Wants one guide or info package"], "areas": ["International and language"]}, {"role": "PhD", "q": "One thing to make life easier for intl researchers", "text": "For international researchers it could provide a handbook on how to settle in Finland and someone to contact with matters relating to this in FIMM, that would be really helpful. Also, if it could provide the information regarding contracts and the legal aspects because you do not know this as an international researcher and often only learn from Finnish friends or colleagues. Finally, the importance of joining the union/unemployment fund.", "themes": ["Wants one guide or info package", "Wants a contact person or set onboarding", "Unclear on tax, healthcare, housing"], "areas": ["International and language"]}, {"role": "Postdoc", "q": "One thing to make life easier for intl researchers", "text": "One idea could be to collect the practical tips into a short guide, so newcomers can find all the necessary info even before they have met anyone. \n\nTo keep the experience good for international researchers, I think it is important that FIMM continues to organise the events and activities it already offers, since they make it easy to connect with others and settle in.", "themes": ["Wants one guide or info package", "Helped: HR call, documents, colleagues"], "areas": ["International and language"]}, {"role": "Postdoc", "q": "What makes it harder to include intl colleagues (Finnish)", "text": "More free time to interact", "themes": ["Cohesion between groups"], "areas": ["Wellbeing and belonging"]}, {"role": "Postdoc", "q": "Training or career development that would help most", "text": "Grant writing workshop/peer support sessions", "themes": ["Grant writing training"], "areas": ["Progress and career"]}, {"role": "Postdoc", "q": "Training or career development that would help most", "text": "Core personnel training in data management", "themes": ["Funds for training and workshops"], "areas": ["Progress and career"]}, {"role": "Postdoc", "q": "Training or career development that would help most", "text": "Supervision guidance (how to become/improve as a supervisor)", "themes": ["Supervision and leadership training"], "areas": ["Progress and career"]}, {"role": "Postdoc", "q": "Training or career development that would help most", "text": "grant writing and applications", "themes": ["Grant writing training"], "areas": ["Progress and career"]}, {"role": "Postdoc", "q": "Training or career development that would help most", "text": "A mentoring program for advance your career if you want to become a PI, but also to help finding another job", "themes": ["Postdoc independence, direction, next steps", "Careers outside academia"], "areas": ["Progress and career"]}, {"role": "Postdoc", "q": "Training or career development that would help most", "text": "Transition to company/private sector", "themes": ["Careers outside academia"], "areas": ["Progress and career"]}, {"role": "Postdoc", "q": "Training or career development that would help most", "text": "training on next grant call and workshop on how to write and apply for grants", "themes": ["Grant writing training"], "areas": ["Progress and career"]}, {"role": "Postdoc", "q": "Training or career development that would help most", "text": "Training in grant writing, supervision and research leadership would benefit me most right now, along with opportunities to learn about different career paths, both inside and outside academia.", "themes": ["Grant writing training", "Supervision and leadership training", "Careers outside academia"], "areas": ["Progress and career"]}, {"role": "PhD", "q": "Improving supervision / what works", "text": "Standardize supervision quality, too much variability across groups currently ... but I guess that is academia in general", "themes": ["Supervision quality varies"], "areas": ["Supervision"]}, {"role": "PhD", "q": "Improving supervision / what works", "text": "I think having bad supervisors is an overall academia problem, not just a FIMM problem", "themes": ["Supervision quality varies"], "areas": ["Supervision"]}, {"role": "PhD", "q": "Improving supervision / what works", "text": "Hire more postdocs", "themes": ["Few postdocs; PhDs carry projects"], "areas": ["Supervision"]}, {"role": "PhD", "q": "Improving supervision / what works", "text": "Maybe monitor it closely and highly encourage PI's to join the social events to make them more available and approachable", "themes": ["Supervision quality varies", "Supervisor and PI time and availability"], "areas": ["Supervision"]}, {"role": "PhD", "q": "Improving supervision / what works", "text": "They could have mandatory leadership trainings for supervisors and also have to have a certain number of post-docs to PhD students. Currently, I am a senior PhD student in a lab with no post-docs so I often have to help others with advice on their projects which takes time from my own work.", "themes": ["Supervision quality varies", "Few postdocs; PhDs carry projects"], "areas": ["Supervision"]}, {"role": "Postdoc", "q": "Improving supervision / what works", "text": "What has worked well is the open and collaborative environment. It is easy to get input not only from your direct supervisor but also from other senior researchers. One thing FIMM could improve is encouraging regular one-to-one meetings and clear expectations on both sides, especially in large projects where supervisors have many responsibilities.", "themes": ["Regular one-to-ones and clear expectations", "Good supervisors, open input from seniors"], "areas": ["Supervision"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "Community", "themes": ["Community and people"], "areas": ["Wellbeing and belonging"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "Community", "themes": ["Community and people"], "areas": ["Wellbeing and belonging"]}, {"role": "Postdoc", "q": "What you enjoy or value", "text": "infrastructure", "themes": ["Infrastructure, data and research quality"], "areas": ["Work situation"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "Openness, flat hierarchy, variety of opportunities", "themes": ["Collaboration, openness, interdisciplinary"], "areas": ["Work situation"]}, {"role": "Postdoc", "q": "What you enjoy or value", "text": "Lots of infra in one place, no teaching/supervision obligation as in other unis", "themes": ["Infrastructure, data and research quality"], "areas": ["Work situation"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "Everyone is so niiiice", "themes": ["Community and people"], "areas": ["Wellbeing and belonging"]}, {"role": "Postdoc", "q": "What you enjoy or value", "text": "Excellent work/life balance and world class research opportunities", "themes": ["Work-life balance", "Infrastructure, data and research quality"], "areas": ["Wellbeing and belonging", "Work situation"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "Great infrastructure for computational work", "themes": ["Infrastructure, data and research quality"], "areas": ["Work situation"]}, {"role": "Postdoc", "q": "What you enjoy or value", "text": "Supportive team", "themes": ["Community and people"], "areas": ["Wellbeing and belonging"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "The access to world class research facilities", "themes": ["Infrastructure, data and research quality"], "areas": ["Work situation"]}, {"role": "Postdoc", "q": "What you enjoy or value", "text": "Cutting edge science, inspiring projects", "themes": ["Infrastructure, data and research quality"], "areas": ["Work situation"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "The feeling of community and opportunities to get to know people from other groups.", "themes": ["Community and people", "Events, seminars, networking"], "areas": ["Wellbeing and belonging"]}, {"role": "Postdoc", "q": "What you enjoy or value", "text": "interdisciplinary and international and supportive environment", "themes": ["Collaboration, openness, interdisciplinary", "Community and people"], "areas": ["Wellbeing and belonging", "Work situation"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "Collaboration, friendly relatively small community", "themes": ["Collaboration, openness, interdisciplinary", "Community and people"], "areas": ["Wellbeing and belonging", "Work situation"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "Teamwork and collaboration", "themes": ["Collaboration, openness, interdisciplinary"], "areas": ["Work situation"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "All the meetings,events that fimm has. These are a way to meet collagues and exchange ideas", "themes": ["Events, seminars, networking"], "areas": ["Wellbeing and belonging"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "the community / network of amazing reaserchers", "themes": ["Community and people"], "areas": ["Wellbeing and belonging"]}, {"role": "Postdoc", "q": "What you enjoy or value", "text": "Networking, being a community", "themes": ["Events, seminars, networking", "Community and people"], "areas": ["Wellbeing and belonging"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "The atmosphere", "themes": ["Community and people"], "areas": ["Wellbeing and belonging"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "Social events, community, translational research, work life balance", "themes": ["Events, seminars, networking", "Community and people", "Work-life balance"], "areas": ["Wellbeing and belonging"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "Good science, nice people", "themes": ["Infrastructure, data and research quality", "Community and people"], "areas": ["Wellbeing and belonging", "Work situation"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "The community and resources offered", "themes": ["Community and people", "Infrastructure, data and research quality"], "areas": ["Wellbeing and belonging", "Work situation"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "Despite the uncertainties related to funding most people face, the situation at FIMM is still better than in many other places and the base PhD salary is adequate to live comfortably in Helsinki.", "themes": ["Funding and salary compare well"], "areas": ["Funding and salary"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "Community", "themes": ["Community and people"], "areas": ["Wellbeing and belonging"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "The truly multidisciplinary environment, cross-group collaboration, and strong communities among early-career researchers across different research groups. The PhD and Postdoc Council has also done awesome work recently! Interesting workshops/sessions, and also this questionnaire is thoroughly made and clearly structured :)\n\nMoreover, I appreciate that there are opportunities for presenting your ongoing work in relatively low-threshold events like the Coffee Break Seminars and the HumGen meeting. This is very valuable for practising presentation skills and for getting feedback outside of your own research group.", "themes": ["Collaboration, openness, interdisciplinary", "Community and people", "Events, seminars, networking"], "areas": ["Wellbeing and belonging", "Work situation"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "Good and supportive working environment in which work-life balance is respected and no one is expected to work overtime and burn themselves out during the PhD, active student community that organizes events and presentation opportunities", "themes": ["Work-life balance", "Events, seminars, networking"], "areas": ["Wellbeing and belonging"]}, {"role": "Postdoc", "q": "What you enjoy or value", "text": "Multicultural working environment, cutting edge tech, collaboration opportunities", "themes": ["Collaboration, openness, interdisciplinary", "Infrastructure, data and research quality"], "areas": ["Work situation"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "Funding opportunities seem to be better than in many other places, some support systems are good", "themes": ["Funding and salary compare well"], "areas": ["Funding and salary"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "Nice space and colleagues, high quality research and diverse fields", "themes": ["Community and people", "Infrastructure, data and research quality"], "areas": ["Wellbeing and belonging", "Work situation"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "Obviously talented and brilliant supervisors. Access to FinnGen is great.", "themes": ["Infrastructure, data and research quality", "Good supervisors, open input from seniors"], "areas": ["Supervision", "Work situation"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "The large emphasis on collaboration", "themes": ["Collaboration, openness, interdisciplinary"], "areas": ["Work situation"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "The work life balance", "themes": ["Work-life balance"], "areas": ["Wellbeing and belonging"]}, {"role": "Postdoc", "q": "What you enjoy or value", "text": "Natural continuation with colleagues, collaborators and projects after the PhD", "themes": ["Collaboration, openness, interdisciplinary"], "areas": ["Work situation"]}, {"role": "Postdoc", "q": "What you enjoy or value", "text": "A sense of belonging to an institute with a meaningful mission.", "themes": ["Community and people"], "areas": ["Wellbeing and belonging"]}, {"role": "Postdoc", "q": "What you enjoy or value", "text": "the researcher community", "themes": ["Community and people"], "areas": ["Wellbeing and belonging"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "There are a lot of casual networking opportunities and interesting talks being organised during workdays!", "themes": ["Events, seminars, networking"], "areas": ["Wellbeing and belonging"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "Community", "themes": ["Community and people"], "areas": ["Wellbeing and belonging"]}, {"role": "PhD", "q": "What you enjoy or value", "text": "I enjoy the support and sense of community within researchers in the building.", "themes": ["Community and people"], "areas": ["Wellbeing and belonging"]}, {"role": "Postdoc", "q": "What you enjoy or value", "text": "I particularly value the combination of a strong scientific environment and a supportive community. FIMM offers excellent research infrastructure and the chance to work on large collaborative projects. The many events and the open atmosphere make it easy to feel part of the institute.", "themes": ["Infrastructure, data and research quality", "Community and people", "Events, seminars, networking"], "areas": ["Wellbeing and belonging", "Work situation"]}, {"role": "PhD", "q": "What you dislike or find challenging", "text": "Competition", "themes": ["Competition and expectations"], "areas": ["Wellbeing and belonging"]}, {"role": "Postdoc", "q": "What you dislike or find challenging", "text": "Workload and lack of salary money for employees", "themes": ["Funding uncertainty, short contracts"], "areas": ["Funding and salary"]}, {"role": "PhD", "q": "What you dislike or find challenging", "text": "There is a nice sense of community but also there is some scattering between focus areas and not that much cohesion/interest between areas", "themes": ["Cohesion between groups"], "areas": ["Wellbeing and belonging"]}, {"role": "Postdoc", "q": "What you dislike or find challenging", "text": "The intransigent nature of being a PostDoc in general and lack of direction and development for next steps", "themes": ["Postdoc independence, direction, next steps"], "areas": ["Progress and career"]}, {"role": "PhD", "q": "What you dislike or find challenging", "text": "Length of phd is too long", "themes": ["Progress tracking, committees, project plans"], "areas": ["Progress and career"]}, {"role": "Postdoc", "q": "What you dislike or find challenging", "text": "When a postdoc is not aiming for a academic career, options are limited and undervalued", "themes": ["Careers outside academia"], "areas": ["Progress and career"]}, {"role": "PhD", "q": "What you dislike or find challenging", "text": "Getting fund", "themes": ["Funding uncertainty, short contracts"], "areas": ["Funding and salary"]}, {"role": "PhD", "q": "What you dislike or find challenging", "text": "Funding uncertainty. Also my lab is spread across the institute, we don't have shared common space, and everyone is in a different office, so unless I'm proactive in interacting with them, we barely meet and I think it's bad for research. So I'd really like to push for leaders to organize the FIMM space in a way that every lab/team is sitting together or at least close to each other. Now many offices have people from different labs, and I'd prefer if it was reorganized, prioritizing people from the same lab to sit together.", "themes": ["Funding uncertainty, short contracts", "Office space, desks and ergonomics"], "areas": ["Funding and salary", "Work situation"]}, {"role": "PhD", "q": "What you dislike or find challenging", "text": "Sometimes a bit empty", "themes": ["Cohesion between groups"], "areas": ["Wellbeing and belonging"]}, {"role": "PhD", "q": "What you dislike or find challenging", "text": "The office space situation. There are not enough desks for everyone and it feels like people who work mostly on-site are being forced to go into flexi-desk rooms, where I'm afraid we will have to \"fight\" for a table everyday. On top of that, several office spaces lack natural light, not providing an adequate environment for intellectual work.", "themes": ["Office space, desks and ergonomics"], "areas": ["Work situation"]}, {"role": "PhD", "q": "What you dislike or find challenging", "text": "Work ergonomics are not ideal for sitting 8h per day at your desk, for example there are no standing desks at offices.", "themes": ["Office space, desks and ergonomics"], "areas": ["Work situation"]}, {"role": "Postdoc", "q": "What you dislike or find challenging", "text": "Projects tend to be PhD projects, where postdoc are considered to have supporting role, which is ok to a certain extent, but may hinder independence", "themes": ["Postdoc independence, direction, next steps"], "areas": ["Progress and career"]}, {"role": "PhD", "q": "What you dislike or find challenging", "text": "Socially I have found this to be a bit difficult environment. There seem to be social cliques, and I have found it difficult and slow to get to know people outside of my immediate research group. There is not a culture of greeting co-workers you do not know personally know etc. I feel like some groups are valued more and some less, which creates somewhat challenging social dynamics.", "themes": ["Cohesion between groups", "Being heard and involved"], "areas": ["Wellbeing and belonging"]}, {"role": "PhD", "q": "What you dislike or find challenging", "text": "Lacking a general sense of community, some groups very isolated, and PIs seem unreachable and inaccessible sometimes (e.g. very few go to the social events)", "themes": ["Cohesion between groups", "Supervisor and PI time and availability"], "areas": ["Supervision", "Wellbeing and belonging"]}, {"role": "PhD", "q": "What you dislike or find challenging", "text": "I am still in my first two months, and the move to Finland has admittedly been challenging. However, my supervisor has been supportive with helping to reimburse visa fees and being understanding with immigration/ID appointments in my first few months.", "themes": ["Unclear on tax, healthcare, housing"], "areas": ["International and language"]}, {"role": "PhD", "q": "What you dislike or find challenging", "text": "That there are very few postdocs and PhD students are forced to run large projects themselves.", "themes": ["Few postdocs; PhDs carry projects"], "areas": ["Supervision"]}, {"role": "PhD", "q": "What you dislike or find challenging", "text": "Unavailability of my supervisor", "themes": ["Supervisor and PI time and availability"], "areas": ["Supervision"]}, {"role": "Postdoc", "q": "What you dislike or find challenging", "text": "Postdocs at FIMM lack a sense of unity or shared concerns that bring them together.", "themes": ["Cohesion between groups"], "areas": ["Wellbeing and belonging"]}, {"role": "PhD", "q": "What you dislike or find challenging", "text": "High expectations can be sometimes a bit stressfull (good and bad thing)", "themes": ["Competition and expectations"], "areas": ["Wellbeing and belonging"]}, {"role": "PhD", "q": "What you dislike or find challenging", "text": "I am in the wet lab and there are few wet labs so this can feel a bit isolating.", "themes": ["Cohesion between groups"], "areas": ["Wellbeing and belonging"]}, {"role": "Postdoc", "q": "What you dislike or find challenging", "text": "Honestly, there is nothing I particularly dislike. My experience as a postdoc at FIMM has been very positive so far.", "themes": ["Nothing to dislike"], "areas": ["Overall"]}, {"role": "PhD", "q": "Single most important action for leadership", "text": "Communication", "themes": ["Being heard and involved"], "areas": ["Wellbeing and belonging"]}, {"role": "PhD", "q": "Single most important action for leadership", "text": "Involve students more in decision making", "themes": ["Being heard and involved"], "areas": ["Wellbeing and belonging"]}, {"role": "PhD", "q": "Single most important action for leadership", "text": "Hold PIs more accountable for their supervision/pay attention to this also for hiring", "themes": ["Supervision quality varies"], "areas": ["Supervision"]}, {"role": "Postdoc", "q": "Single most important action for leadership", "text": "Provide opportunities for advancement or directions for how to do so", "themes": ["Postdoc independence, direction, next steps"], "areas": ["Progress and career"]}, {"role": "PhD", "q": "Single most important action for leadership", "text": "Call PIs out on their behavior. Promoting a no harassment policy with action, not just words that people put on their webpage and then keep going on as before", "themes": ["PI behaviour and harassment policy", "Supervision quality varies"], "areas": ["Supervision", "Wellbeing and belonging"]}, {"role": "Postdoc", "q": "Single most important action for leadership", "text": "Enhance career development training for non-academic aims thereby making realistic nonacademic career tracks visible and respected", "themes": ["Careers outside academia"], "areas": ["Progress and career"]}, {"role": "Postdoc", "q": "Single most important action for leadership", "text": "Funding for only postdocs", "themes": ["Funding uncertainty, short contracts"], "areas": ["Funding and salary"]}, {"role": "PhD", "q": "Single most important action for leadership", "text": "Thesis committees are not as helpful as they should be and different people have different experience with it. Meeting just once or twice a year may not be enough. I also think the doctoral thesis committee doesn't have much impact", "themes": ["Progress tracking, committees, project plans"], "areas": ["Progress and career"]}, {"role": "PhD", "q": "Single most important action for leadership", "text": "I think the most important thing is that the supervisors actually have time for their students.", "themes": ["Supervisor and PI time and av const LK = ["var(--l1)", "var(--l2)", "var(--l3)", "var(--l4)", "var(--l5)"], LKT = ["#fff", "#1d1d1f", "#1d1d1f", "#1d1d1f", "#fff"];
const MIN_N = 3;
const ORDER = {

  gender: ["Female", "Male", "Prefer not to say"], prior_fimm: ["Yes", "No"], phd_stage: ["Pre-PhD or year 1", "Year 2", "Year 3+"],

};
// colour bins for the "All questions at once" tab: [lower bound, fill, text colour, legend label]
const BINS = {
  u: [[40, "#B3402F", "#fff", "40% or more"], [25, "#EE9F8C", "#1d1d1f", "25-39%"], [10, "#F7D5CC", "#1d1d1f", "10-24%"], [-1, "#fff", "#1d1d1f", "under 10%"]],
  f: [[75, "#245A93", "#fff", "75% or more"], [60, "#86AED8", "#1d1d1f", "60-74%"], [40, "#D3E1F0", "#1d1d1f", "40-59%"], [-1, "#fff", "#1d1d1f", "under 40%"]],

      [2.5, "#F7D5CC", "#1d1d1f", "2.50-2.99"], [-1, "#EE9F8C", "#1d1d1f", "below 2.50"]],
};
const binOf = (metric, v) => BINS[metric].find(b => v >= b[0]);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tip = $("tip");
document.addEventListener("mousemove", e => { if (tip.style.display === "block") { tip.style.left = (e.clientX + 12) + "px"; tip.style.top = (e.clientY + 12) + "px"; } });
function showTip(t) { tip.textContent = t; tip.style.display = "block"; }
function hideTip() { tip.style.display = "none"; }

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  ["items", "heat", "cmts"].forEach(id => $(id).style.display = id === b.dataset.tab ? "" : "none");
});
function fillSplit(sel) {
  sel.innerHTML = '<option value="">No split</option>' + Object.entries(D.splits).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("");
}
$("area").innerHTML = '<option value="">All areas</option>' + Object.entries(D.areas).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("");
fillSplit($("split")); fillSplit($("hsplit"));
$("split").value = "role"; $("hsplit").value = "intl";

function groups(split, role) {
  const rs = D.resp.filter(r => !role || r.role === role);
  if (!split) return [["All", rs]];
  const m = new Map();
  rs.forEach(r => { const g = r[split]; if (g == null) return; if (!m.has(g)) m.set(g, []); m.get(g).push(r); });
  const ord = ORDER[split] || [];
  const rank = g => { const i = ord.indexOf(g); return i < 0 ? 999 : i; };
  return [...m.entries()].sort((a, b) => rank(a[0]) - rank(b[0]) || String(a[0]).localeCompare(String(b[0])));
}
function dist(rs, i) {
  const c = [0, 0, 0, 0, 0]; rs.forEach(r => { const v = r.q[i]; if (v) c[v - 1]++; });
  return c;
}
const sum = a => a.reduce((x, y) => x + y, 0);

function drawItems() {
  const area = $("area").value, split = $("split").value, role = $("role").value;
  const gs = groups(split, role);
  let html = "", hiddenCount = 0;
  D.items.forEach((it, i) => {
    if (area && it.area !== area) return;
    const rows = [];
    gs.forEach(([g, rs]) => {
      const c = dist(rs, i), n = sum(c);
      if (n === 0) return;
      if (n < MIN_N) { hiddenCount++; rows.push([g, null, n]); return; }
      rows.push([g, c, n]);
    });
    if (!rows.length) return;
    rows.forEach(([g, c, n], j) => {
      html += `<tr class="${j === 0 ? "first" : ""}">`;
      if (j === 0) html += `<td class="itemlab" rowspan="${rows.length}" title="${esc(it.full)}">${esc(it.label)}${it.reverse ? " <span class='hidden'>(reversed)</span>" : ""}${it.only ? ` <span class='hidden'>(${it.only === "intl" ? "intl only" : "Finnish only"})</span>` : ""}</td>`;
      html += `<td class="grp">${esc(g)} <span class="n">n=${n}</span></td>`;
      if (!c) { html += `<td colspan="3" class="hidden">fewer than ${MIN_N} people, not shown</td></tr>`; return; }
      const cc = it.reverse ? [c[4], c[3], c[2], c[1], c[0]] : c;
      const lab = (k, p) => `${esc(g)}: answer ${it.reverse ? 5 - k : k + 1} = ${cc[k]} of ${n} (${Math.round(p)}%)`;
      const seg = (k, p, style) => `<div class="seg" style="${style};background:${LK[k]};color:${LKT[k]}" data-t="${lab(k, p)}">${p >= 7 ? Math.round(p) + "%" : ""}</div>`;
      const mode = $("mode").value;
      if (mode === "stack") {
        html += `<td><div class="bar">` + [0, 1, 2, 3, 4].map(k => { const p = 100 * cc[k] / n; return cc[k] ? seg(k, p, `width:${p}%`) : ""; }).join("") + `</div></td>`;
      } else {
        const P = cc.map(x => 100 * x / n), neutral = mode === "div" ? P[2] : 0;
        let segs = [];
        let left = 50 - neutral / 4 - (P[1] + P[0]) / 2;
        [[0, P[0] / 2], [1, P[1] / 2]].forEach(([k, w]) => { if (w > 0) segs.push(seg(k, P[k], `left:${left}%;width:${w}%`)); left += w; });
        if (mode === "div" && P[2] > 0) { segs.push(seg(2, P[2], `left:${left}%;width:${P[2] / 2}%`)); left += P[2] / 2; }
        else left = 50;
        [[3, P[3] / 2], [4, P[4] / 2]].forEach(([k, w]) => { if (w > 0) segs.push(seg(k, P[k], `left:${left}%;width:${w}%`)); left += w; });
        html += `<td><div style="display:flex;gap:12px;align-items:center"><div class="dbar">${segs.join("")}<div class="mid"></div></div>` +
          (mode === "divn" ? `<div style="display:flex;align-items:center;gap:6px;width:130px"><div class="nbar" title="neutral (3)"><div class="seg" style="width:${P[2]}%;height:100%;background:${LK[2]}" data-t="${lab(2, P[2])}"></div></div><span style="font-size:11px;color:var(--ink2)">${Math.round(P[2])}%</span></div>` : "") + `</div></td>`;
      }
      const u = it.reverse ? c[3] + c[4] : c[0] + c[1], f = it.reverse ? c[0] + c[1] : c[3] + c[4];
      html += `<td class="num u">${Math.round(100 * u / n)}%</td><td class="num">${Math.round(100 * f / n)}%</td></tr>`;
    });
  });
  $("lk").innerHTML = `<tr><td></td><td></td><td></td><td class="num" style="color:var(--ink2)">Unfav.</td><td class="num" style="color:var(--ink2)">Fav.</td></tr>` + html;
  $("lk").querySelectorAll(".seg").forEach(s => { s.onmouseenter = () => showTip(s.dataset.t); s.onmouseleave = hideTip; });
  $("lknote").textContent = ($("mode").value === "divn" ? "Diverging bars show 1-2 left and 4-5 right of the centre line; the small grey bar on the right is the share answering 3. " : $("mode").value === "div" ? "Diverging bars: 1-2 left of the centre line, 4-5 right, 3 split across the centre. " : "") + "Hover a segment for counts. Hover a question for its full wording. PhD wellbeing questions were added after the first 16 PhD responses." + (hiddenCount ? ` ${hiddenCount} group row(s) hidden because n < ${MIN_N}.` : "");
}
["area", "split", "role", "mode"].forEach(id => $(id).onchange = drawItems);

function drawHeat() {
  const split = $("hsplit").value, role = $("hrole").value, metric = $("hmetric").value;
  const gs = groups(split, role);
  let html = `<table class="hm"><tr><th></th><th></th>` + gs.map(([g, rs]) => `<th>${esc(g)}<span class="n">n=${rs.length}</span></th>`).join("") + `</tr>`;
  let last = null;
  D.items.forEach((it, i) => {
    html += `<tr class="${it.area !== last ? "sep" : ""}"><td class="area">${it.area !== last ? esc(D.areas[it.area]) : ""}</td><td class="lab" title="${esc(it.full)}">${esc(it.label)}</td>`;
    last = it.area;
    gs.forEach(([g, rs]) => {
      const c = dist(rs, i), n = sum(c);
      if (n < MIN_N) { html += `<td style="color:var(--muted)">${n ? "&lt;3" : ""}</td>`; return; }
      const u = 100 * (it.reverse ? c[3] + c[4] : c[0] + c[1]) / n, f = 100 * (it.reverse ? c[0] + c[1] : c[3] + c[4]) / n;
      const mean = c.reduce((a, x, k) => a + x * (k + 1), 0) / n;
      const val = metric === "u" ? u : metric === "f" ? f : (it.reverse ? 6 - mean : mean);
      const v = metric === "m" ? val.toFixed(2) : Math.round(val) + "%";
      const [, bg, col] = binOf(metric, metric === "m" ? val : Math.round(val));
      html += `<td style="background:${bg};color:${col}" title="${esc(g)}: n=${n}">${v}</td>`;
    });
    html += `</tr>`;
  });
  html += `</table><p class="note">Blank = question not asked of this group. &lt;3 = fewer than 3 people, hidden. Mean for the funding-worry question is flipped (6 - mean) so that higher is always more favourable.</p>`;
  const what = { u: "Share answering 1-2 (funding worry: 4-5)", f: "Share answering 4-5 (funding worry: 1-2)", m: "Average on the 1-5 scale; 3 is the scale midpoint, red below 3, blue from 3.50" }[metric];
  html = `<div class="legend" style="flex-wrap:wrap;margin-bottom:12px">${what}: ` + BINS[metric].slice().reverse().map(b => `<span class="sw" style="width:auto;padding:0 6px;background:${b[1]};color:${b[2]};border:1px solid #e4e2dd">${b[3]}</span>`).join("") + `</div>` + html;
  $("hm").innerHTML = html;
}
["hsplit", "hrole", "hmetric"].forEach(id => $(id).onchange = drawHeat);

let activeTheme = null;
$("cq").innerHTML = '<option value="">All questions</option>' + [...new Set(D.comments.map(c => c.q))].map(q => `<option>${esc(q)}</option>`).join("");
function drawComments() {
  const q = $("cq").value, role = $("crole").value, s = $("cs").value.trim().toLowerCase();
  const base = D.comments.filter(c => (!q || c.q === q) && (!role || c.role === role) && (!s || c.text.toLowerCase().includes(s)));
  const counts = {};
  base.forEach(c => c.themes.forEach(t => counts[t] = (counts[t] || 0) + 1));
  const max = Math.max(1, ...Object.values(counts));
  $("ct").innerHTML = Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([t, n]) =>
    `<div class="th ${t === activeTheme ? "on" : ""}" data-t="${esc(t)}"><div class="tb" style="width:${80 * n / max}px"></div>${esc(t)} (${n})</div>`).join("");
  $("ct").querySelectorAll(".th").forEach(el => el.onclick = () => { activeTheme = activeTheme === el.dataset.t ? null : el.dataset.t; drawComments(); });
  const list = base.filter(c => !activeTheme || c.themes.includes(activeTheme));
  $("cc").textContent = `${list.length} comment(s)` + (activeTheme ? ` in "${activeTheme}" (click the group again to clear)` : ". Click a group to filter.");
  $("cl").innerHTML = list.map(c => `<div class="cmt">${esc(c.text).replace(/\n+/g, "<br>")}<div class="meta">${c.role === "PhD" ? "PhD student" : "Postdoc"} &middot; ${esc(c.q)}</div><div>${c.themes.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div></div>`).join("");
}
